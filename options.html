<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Teams</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <img src="icons/icon48.png" alt="Better Teams Logo" class="logo">
      <h1>Better Teams</h1>
    </div>

    <!-- Options -->
    <div class="options">
      <label class="switch">
        <input type="checkbox" id="enablePreviews" checked>
        <span class="slider"></span>
      </label>
      <span>Enable link previews</span>
    </div>

    <div class="options">
      <label class="switch">
        <input type="checkbox" id="enableUITweaks" checked>
        <span class="slider"></span>
      </label>
      <span>Enable UI tweaks</span>
    </div>

    <button id="resetBtn" class="reset-btn">Reset to Defaults</button>

    <hr>

    <!-- CTA Section -->
    <div class="cta">
      <p>💜 Enjoying <strong>Better Teams</strong>?<br>
      ⭐ Please <a href="https://chrome.google.com/webstore/detail/YOUR_EXTENSION_ID/reviews" target="_blank">leave a review</a>!</p>

      <a href="https://www.buymeacoffee.com/YOURPAGE" target="_blank" class="coffee-btn">
        ☕ Buy me a coffee
      </a>
    </div>
  </div>
</body>
</html>
